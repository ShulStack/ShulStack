services:
  postgres:
    image: postgres:16-alpine
    container_name: shulstack-postgres
    environment:
      POSTGRES_DB: shulstack
      POSTGRES_USER: shulstack
      POSTGRES_PASSWORD: shulstack
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shulstack -d shulstack"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    container_name: shulstack-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
